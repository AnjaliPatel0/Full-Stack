<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop</title>
</head>
<body>
    
</body>
<script>
    let w=1;
    while(w<=10){
       console.log(w,"Welcome to Ws")
       w++ ;
    }

    // while(true){
    //     // infinite time loop run 
    // }

    let i=1;
    do{
       console.log(i)
       i++;
    }while(i>=10);
</script>
