<!-- Login Page -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        .loginModal{
            width: 30%;
            height: 100vh;
            position: fixed;
            transition: 0.5s;
            padding: 30px;
            /* right: 0px; */
            right: -500px;
            top: 0px;
            background-color:#ccc;
        }
        .loginModal span{
            font-size: 30px;
            cursor: pointer;
        }
        .headingModal{
            display: flex;
            margin-top: 100px;
            justify-content: space-between;
        }
        .headingModal h3{
            font-size: 20px;
        }
        .loginModal form{
            margin-top: 40px;
            
        }
        .loginModal form label{
            display: block;
        }
        .loginModal form input{
           width: 100%;
           height: 40px; 
           border-radius: 5px;
           margin-top: 10px;
        }
        .loginModal form button{
            width: 100%;
            padding: 10px 0px;
            margin-top: 30px;
            color: white;
            font-size:20px ;
            border: none;
            background-color: #194cff;
        }
        .loginModal form p{
            margin-top: 20px;
        }
        .showModal{
            right:0px
        }
    </style>
 </head>
 <body>
    <button id="login">Login</button>
    <div class="loginModal ">
        <span>&times;</span>
        <div class="headingModal">
            <h3>Login</h3>
            <p>Use email,instead</p>
        </div>

        <form action="">
            <label for="">Mobile Number</label>
            <input type="text">
            <button>Login</button>
            <p>Don't have an account? <a href="">Create an account</a></p>
        </form>
    </div>
       
 </body>
 <script>
    let loginbtn=document.querySelector("#login")
    let colsebtn=document.querySelector(".loginModal span")
    let loginModalEle=document.querySelector(".loginModal")
    loginbtn.addEventListener("click",()=>{
        loginModalEle.classList.add('showModal')
    })
    colsebtn.addEventListener("click",()=>{
         loginModalEle.classList.remove('showModal')
    })
 </script>
 </html>
