<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Method</title>
</head>
<body>
    
</body>
<script>
    let l=[10,20,30,40,50]
    l.push(45) // last
    console.log(l)

    // copy array using ... shallow copy not effect main array
    let m=[...l]
    m.push(99)
    
    console.log(m)

    // push in first
    l.unshift(9)
    console.log(l) 

    // pop 
    let n=[10,20,30,40,50]
    console.log(  n.pop(),"pop last ele")
    console.log(n) 

    n.shift() // delete from first
    console.log(n) 

    // convert in String separte by comma (,)
    let s=["Ravi","Ram","Raj"]
    let data=s.toString()
    console.log(data)

    // join data using separtor
    let joinData=s.join('-')
    console.log(joinData)

    // includes is used to find value available or not
    let x=[10,20,30,55,66]
    console.log(x.includes(55))

    // concate
    let x1=[88,89,"ravi","raj"]
    let newArray=x1.concat(x)
    console.log(newArray)

    // splice -> delete and add
    let a=[10,20,30,55,66]
    a.splice(1,2) // delete start from 1 to 2
    console.log(a)
    a.splice(1,0,88,67) // delete start from 1 to 0 and add
    console.log(a)


    // Slice-> take slice of element
     let b=[10,20,30,55,66]
     let newarray=b.slice(1,2) // strat to end-1
     console.log(newarray)

    //  flat -> remove multi dimension print one dimension
    let c=[10,20,30,55,66,[77,88],33,24,[56,45]]
    console.log(c.flat())

    // update array
    let d=[10,20,30,55,66]
    d[2]=44;
    console.log(d)
</script>
</html>
