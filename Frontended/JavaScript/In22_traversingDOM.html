<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traversing DOM</title>
    <style>
        *{
            margin: 0px;
            padding: 0px ;
            font-family: sans-serif;
        }
        .main{
            width: 1320px;
            margin: auto;
            padding: 30px;
            border: 1px solid blueviolet;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Welcome</h1>
        <button>Save</button>
        <p>Welcome <b>to</b> <u>WS</u> </p>
    </div>
</body>
<script>
    let btn = document.querySelector("button")
    btn.addEventListener("click",()=>{
        // btn.parentElement.remove()
        btn.parentElement.style.background="yellow"
        btn.previousElementSibling.style.color="red"
        btn.nextElementSibling.style.fontSize="30px"
        console.log(btn.nextElementSibling.children)
        console.log(btn.nextElementSibling.lastElementChild)
    })
</script>
</html>
