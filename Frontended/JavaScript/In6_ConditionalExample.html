<!-- Grade Calculator Determines a student's grade based on theeir
 score: A(90-100),B(80-89),C(70-79),D(60-69),F(below 60). else if -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    
 </body>
 <script>
    let score =Number(prompt("Enter the value"))
    if(score>100){
       console.log("Invalid") 
    }
    else if(score>=90){
       console.log("Grade A")
    }
    else if(score>=80){
       console.log("Grade B")
    }
    else if(score>=70){
       console.log("Grade C")
    }
    else if(score>=60){
       console.log("Grade D")
    }
    else{
        console.log("grade F")
    }
 </script>
 </html>
