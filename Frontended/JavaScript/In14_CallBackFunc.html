<script>
    let displayData=(res)=>{
        return res
    }

        return result(num1+num2)
    }

    let output=sumData(20,30,displayData)

    // ForEach or anonmus func diplay direct array value
    let l=[20,30,40,45]

         console.log(v,i)
    })

    // map func -> don't change in existing array or create new array
    let l1=[10,20,30,40,45]
    let finalAns=l.map((v,i)=> v+5)
    console.log(finalAns)


    // filter func
    let l2=[21,55,10,20,30,40,45]
